[package]
name = "mosha"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Browser-rendered website mirroring and hydration-aware editing"
license = "MIT"
repository = "https://github.com/enkyuan/mosha"
readme = "README.md"
exclude = ["/.github/**", "/.gstack/**", "/.editorconfig"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
headless_chrome = "1.0.22"
html-escape = "0.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
robotstxt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = { version = "2", features = ["serde"] }
walkdir = "2"
tempfile = "3"

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
http-body-util = "0.1"

[[bench]]
name = "editing"
harness = false

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
