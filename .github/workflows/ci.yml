name: Rust CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Avoid the macOS ARM pool, which can fail before acquiring a runner.
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'macOS'
        id: chrome
      - name: Prepare Chrome
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Chrome's renderer helpers require a real .app bundle. setup-chrome
            # extracts its contents into a cache directory without that suffix.
            bundle="${CHROME_PATH%/Contents/MacOS/*}"
            ditto "$bundle" "$RUNNER_TEMP/Chrome.app"
            CHROME_PATH="$RUNNER_TEMP/Chrome.app/Contents/MacOS/Google Chrome for Testing"
          else
            # Ubuntu's AppArmor policy allows the system Chrome installation
            # to create its sandbox, but not a downloaded tool-cache binary.
            CHROME_PATH="$(command -v google-chrome)"
          fi
          echo "MOSHA_CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Check Linux browser startup
        if: runner.os == 'Linux'
        run: |
          timeout 20s "$MOSHA_CHROME" --headless --disable-gpu \
            --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank
      - run: cargo test --locked --test browser -- --ignored
      - run: cargo run --locked --release --example heap_profile
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit
